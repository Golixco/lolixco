name: Frontend CI

'on':
  push:
    branches:
      - main
      - feat/discovery-ui-search
      - feat/recsys-baseline
      - feat/mission5-recsys-integration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Frontend and Recsys Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python API dependencies
        run: pip install fastapi uvicorn httpx pydantic

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run unit and regression tests
        run: pnpm test

      - name: Run local media asset checks
        run: pnpm check:assets

      - name: Run production build
        run: pnpm build

      - name: Run recommendation tests
        run: python3 -m unittest discover -s server/recsys/tests -v

      - name: Run catalog drift validation
        run: python3 -m server.recsys.export_catalog --check

      - name: Run recommendation API smoke test
        run: |
          python3 -m uvicorn server.recsys.api:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          sleep 2
          curl -f http://127.0.0.1:8000/api/v1/health
          curl -f http://127.0.0.1:8000/api/v1/ready
          curl -f -X POST http://127.0.0.1:8000/api/v1/recommendations \
            -H "Content-Type: application/json" \
            -d '{"surface":"up_next","current_edit_id":0,"limit":2}'
          kill $SERVER_PID
