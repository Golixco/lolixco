name: Frontend CI

'on':
  push:
    branches:
      - main
      - feat/discovery-ui-search
      - feat/recsys-baseline
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Frontend and Recsys Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run unit and regression tests
        run: pnpm test

      - name: Run local media asset checks
        run: pnpm check:assets

      - name: Run production build
        run: pnpm build

      - name: Run recommendation tests
        run: python3 -m unittest discover -s server/recsys/tests -v

      - name: Run catalog drift validation
        run: python3 -m server.recsys.export_catalog --check
